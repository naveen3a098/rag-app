<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Project</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --border: #262932;
    --text: #e4e6eb;
    --muted: #8a8f98;
    --accent: #5b8cff;
    --accent-dim: #2a3a5c;
    --user-bubble: #1f2530;
    --ai-bubble: #14202e;
    --error: #ff6b6b;
    --success: #4ade80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  header {
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .upload-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .file-label {
    flex: 1;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-label:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .file-label.has-file {
    color: var(--text);
    border-color: var(--accent-dim);
  }

  input[type="file"] {
    display: none;
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  button:hover:not(:disabled) { opacity: 0.9; }
  button:active:not(:disabled) { transform: scale(0.98); }

  button:disabled {
    background: var(--accent-dim);
    color: var(--muted);
    cursor: not-allowed;
  }

  .status {
    margin-top: 12px;
    font-size: 13px;
    min-height: 18px;
  }

  .status.success { color: var(--success); }
  .status.error { color: var(--error); }
  .status.loading { color: var(--muted); }

  .chat-log {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 16px;
    max-height: 50vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  .chat-log:empty::after {
    content: "Ask a question about your uploaded document.";
    color: var(--muted);
    font-size: 14px;
  }

  .bubble {
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 90%;
  }

  .bubble.user {
    background: var(--user-bubble);
    align-self: flex-end;
    color: var(--text);
  }

  .bubble.ai {
    background: var(--ai-bubble);
    align-self: flex-start;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .bubble.ai.loading {
    color: var(--muted);
    font-style: italic;
  }

  .ask-row {
    display: flex;
    gap: 10px;
  }

  .ask-row input[type="text"] {
    flex: 1;
    background: #0b0c0f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
  }

  .ask-row input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .ask-row input[type="text"]::placeholder {
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>RAG Project</h1>
      <p>Upload a PDF, then ask questions about it.</p>
    </header>

    <div class="panel">
      <h2>Document</h2>
      <div class="upload-row">
        <label class="file-label" id="fileLabel" for="fileInput">Choose a file…</label>
        <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv">
        <button id="uploadBtn" disabled>Upload</button>
      </div>
      <div class="status" id="uploadStatus"></div>
    </div>

    <div class="panel">
      <h2>Ask</h2>
      <div class="chat-log" id="chatLog"></div>
      <div class="ask-row">
        <input type="text" id="questionInput" placeholder="What is this document about?">
        <button id="askBtn">Ask</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const chatLog = document.getElementById('chatLog');
    const questionInput = document.getElementById('questionInput');
    const askBtn = document.getElementById('askBtn');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        fileLabel.textContent = fileInput.files[0].name;
        fileLabel.classList.add('has-file');
        uploadBtn.disabled = false;
      } else {
        fileLabel.textContent = 'Choose a PDF…';
        fileLabel.classList.remove('has-file');
        uploadBtn.disabled = true;
      }
    });

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      uploadStatus.textContent = 'Uploading and indexing…';
      uploadStatus.className = 'status loading';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(`${API_BASE}/api/docs/upload`, {
          method: 'POST',
          body: formData
        });
        const text = await res.text();

        if (!res.ok) {
          throw new Error(text || `Server returned ${res.status}`);
        }

        uploadStatus.textContent = text;
        uploadStatus.className = 'status success';
      } catch (err) {
        uploadStatus.textContent = 'Upload failed: ' + err.message;
        uploadStatus.className = 'status error';
      } finally {
        uploadBtn.disabled = false;
      }
    });

    function addBubble(text, role) {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      chatLog.appendChild(bubble);
      chatLog.scrollTop = chatLog.scrollHeight;
      return bubble;
    }

    async function askQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      addBubble(question, 'user');
      questionInput.value = '';
      askBtn.disabled = true;

      const loadingBubble = addBubble('Thinking…', 'ai loading');

      try {
        const url = `${API_BASE}/api/ask?question=${encodeURIComponent(question)}`;
        const res = await fetch(url);
        const text = await res.text();

        if (!res.ok) {
          throw new Error(text || `Server returned ${res.status}`);
        }

        loadingBubble.textContent = text;
        loadingBubble.classList.remove('loading');
      } catch (err) {
        loadingBubble.textContent = 'Error: ' + err.message;
        loadingBubble.classList.remove('loading');
      } finally {
        askBtn.disabled = false;
      }
    }

    askBtn.addEventListener('click', askQuestion);
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askQuestion();
    });
  </script>
</body>
</html>
